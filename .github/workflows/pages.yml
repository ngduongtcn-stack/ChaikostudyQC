# Builds the site from src/data/questions.json and publishes it to GitHub Pages.
# Runs on every push to main (e.g. after editing questions on github.com) or manually.
name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false  # let each run finish; a cancelled half-run made the deploy step fail

jobs:
  # Two jobs, as in GitHub's official Pages workflow: the artifact is fully finalized
  # before the deploy job starts (a single job sometimes failed with "No artifacts named github-pages").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build site
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
